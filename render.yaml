databases:
  - name: command-de-cuisine-db
    plan: 0.1c-256mb
    databaseName: command_de_cuisine
    user: command_de_cuisine

services:
  - type: web
    name: command-de-cuisine
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: rm -rf app _release_unpack && mkdir _release_unpack && unzip -q Command-de-Cuisine-clean-production.zip -d _release_unpack && mv _release_unpack/Command-de-Cuisine-clean app && pip install -r app/requirements.txt
    startCommand: cd app && python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: command-de-cuisine-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
