services:
  - type: web
    name: command-de-cuisine
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: rm -rf app _release_unpack && mkdir _release_unpack && unzip -q Command-de-Cuisine-clean-production.zip -d _release_unpack && mv _release_unpack/Command-de-Cuisine-clean app && python apply_supabase_storage_patch.py && python apply_multitenant_patch.py && python apply_temperature_status_patch.py && python apply_offline_equipment_compliance_patch.py && python apply_compliance_due_window_patch.py && python apply_stock_units_patch.py && python apply_offline_asset_cache_bust.py && python apply_print_popup_hardening.py && python externalize_main_script.py && python apply_probe_calibration_visual_patch.py && python apply_recipe_import_patch.py && python apply_recipe_editor_import_button.py && python apply_allergen_print_patch.py && python apply_static_script_routes.py && python apply_manager_remove_controls.py && python apply_manager_remove_cache_bust.py && python apply_staff_delete_ui_patch.py && python apply_manager_context_v6.py && pip install -r app/requirements.txt
    startCommand: cd app && python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://dzzqmcxnselhjsraquym.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: command-de-cuisine
