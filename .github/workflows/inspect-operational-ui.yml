name: Inspect kitchen operational layouts
on:
  push:
    branches: [feature/kitchen-operations-ux-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble current app
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          build=yaml.safe_load(Path('render.yaml').read_text())['services'][0]['buildCommand']
          subprocess.run(build,shell=True,executable='/bin/bash',check=True)
          PY
      - name: Inspect operation entry points
        run: python tests/inspect_operational_ui.py
