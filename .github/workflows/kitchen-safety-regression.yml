name: Kitchen safety and recipe regression
on:
  push:
    branches: [fix/safety-recipe-backup-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble full Render production build
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          build=yaml.safe_load(Path('render.yaml').read_text())['services'][0]['buildCommand']
          subprocess.run(build,shell=True,executable='/bin/bash',check=True)
          PY
      - name: Syntax and security assertions
        run: |
          python -m py_compile app/auth_controls.py app/temperature_store.py app/drive_storage.py apply_kitchen_safety_editor_patch.py
          node --check app/main_app.js
          node --check app/allergen_matrix_safety.js
          python - <<'PY'
          from pathlib import Path
          index=Path('app/index.html').read_text()
          auth=Path('app/auth_controls.py').read_text()
          temp=Path('app/temperature_store.py').read_text()
          assert index.count('main_app.js?v=20261020-kitchen-safety1')==1
          assert auth.count('def _cdc_protected_state_change(')==1
          assert "Manager access required to delete" in temp
          assert "Only a manager can edit and verify ingredient allergens." in Path('app/allergen_matrix_safety.js').read_text()
          assert "temperatureReadingCount" in Path('app/drive_storage.py').read_text()
          print("PASS: Full production build installed expected safeguards")
          PY
      - name: Test server guards and authoritative backups
        run: python tests/test_kitchen_safety_patch.py
      - name: Install headless browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test unified recipe editing and ingredient saves
        run: python tests/test_recipes_unified_editor.py
      - name: Test recipe Cancel and draft allergen Save on desktop/mobile
        run: python tests/test_recipe_cancel.py
