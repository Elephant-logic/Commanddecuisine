name: Test supplier registration and dual delivery temperatures
on:
  push:
    branches: [fix/supplier-delivery-chilled-frozen-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble deployed application offline
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          cmd=yaml.safe_load(Path('render.yaml').read_text())['services'][0]['buildCommand']
          subprocess.run(cmd,shell=True,executable='/bin/bash',check=True)
          PY
      - name: Check assembled app and dual goods-in controls
        run: |
          python -m py_compile apply_supplier_delivery_dual_temp_patch.py
          node --check app/main_app.js
          python - <<'PY'
          from pathlib import Path
          text=Path('app/main_app.js').read_text()
          page=Path('app/index.html').read_text()
          assert text.count('function cdcSupplierNames(){')==1
          assert 'Chilled temperature (°C)' in text and 'Frozen temperature (°C)' in text
          assert 'Earlier reading (type unspecified)' in text
          assert 'main_app.js?v=20261020-dual-delivery-temp1' in page
          print('PASS: full production build serves dual-temperature goods-in and shared suppliers')
          PY
      - name: Install Chromium browser testing
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser-check supplier flow and chilled/frozen records
        run: python tests/test_supplier_dual_delivery_temps.py

