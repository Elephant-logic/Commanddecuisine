name: Inspect supplier and delivery forms
on:
  push:
    branches: [fix/supplier-delivery-chilled-frozen-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble deployed application offline
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import subprocess,yaml
          from pathlib import Path
          cmd=yaml.safe_load(Path('render.yaml').read_text())['services'][0]['buildCommand']
          subprocess.run(cmd,shell=True,executable='/bin/bash',check=True)
          PY
      - name: Inspect delivery and supplier screens
        run: python tests/inspect_delivery_supplier.py
