name: Timers diagnostics
on:
  push:
    branches:
      - fix/timers-buttons-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect production timer UI and event handlers
        run: python tests/diagnose_timers.py
