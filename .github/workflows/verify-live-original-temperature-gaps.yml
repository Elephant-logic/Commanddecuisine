name: Verify live original missed-temperature controls
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify live Temperature gaps and Fill missing routes (read-only)
        run: python tests/verify_live_original_temperature_gaps.py
